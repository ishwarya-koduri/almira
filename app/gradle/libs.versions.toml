# The versions this app is built with, in one place.
#
# Kotlin is pinned to the same 2.1.21 the backend uses. They are separate Gradle
# builds and need not agree — but a house with one Kotlin version in it is a
# house where "which one does this module use" is never a question.
[versions]
kotlin = "2.1.21"
compose = "1.8.2"
agp = "8.11.2"
androidx-activity = "1.9.3"
androidx-core = "1.15.0"
# BiometricPrompt. 1.1.0 is the current stable; it needs a FragmentActivity,
# which is why MainActivity extends one.
androidx-biometric = "1.1.0"
# MainActivity is a FragmentActivity because BiometricPrompt requires one.
androidx-fragment = "1.8.5"
# SMS Retriever: one message handed over, no READ_SMS anywhere near it.
play-services-auth-api-phone = "18.2.0"
# Only for the on-device run of the passphrase vectors, which have to meet
# Android's crypto provider rather than the JDK's.
androidx-test-junit = "1.2.1"
androidx-test-runner = "1.6.2"
# Ktor 3.2.3 is the newest release built against Kotlin 2.1.21 — verified from
# its POM, not assumed. 3.3 moves to Kotlin 2.2 metadata and 3.4 to 2.3, and
# this compiler cannot read either.
ktor = "3.2.3"
serialization = "1.8.1"
coroutines = "1.10.2"

[libraries]
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidx-biometric" }
androidx-fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "androidx-fragment" }
play-services-auth-api-phone = { module = "com.google.android.gms:play-services-auth-api-phone", version.ref = "play-services-auth-api-phone" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
