spring:
  application:
    name: almira
  # The DataSource beans are declared explicitly in DatabaseConfig (two roles:
  # owner for migrations, non-owner for requests), so auto-configuration is off.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  data:
    redis:
      host: ${ALMIRA_REDIS_HOST:localhost}
      port: ${ALMIRA_REDIS_PORT:56379}
      # Empty locally, where Redis is not reachable off the machine. Set in any
      # deployment: this store holds one-time codes, and a code store anybody
      # can read is a sign-in anybody can complete.
      password: ${ALMIRA_REDIS_PASSWORD:}
      timeout: 2s
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # Documents are scans and photos; the 1MB default rejects most of them.
      max-file-size: 20MB
      max-request-size: 24MB

server:
  port: ${ALMIRA_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful

almira:
  # Anything other than "development" makes every startup check strict: a real
  # key-encryption key becomes mandatory, the published JWT secret is refused,
  # and a database without page checksums is refused.
  #
  # There is deliberately NO default. It used to be `${ALMIRA_ENV:development}`,
  # which meant a jar started without the variable decided it was a development
  # machine — and so accepted the development JWT secret published in this
  # repository. Reproduced before this changed: with ALMIRA_ENV unset, a token
  # signed with that secret, for a session the server never issued, returned
  # 200 from /api/v1/me as a real user. A missing value now counts as "not
  # development", so every check applies.
  #
  # Every intended launcher sets it: dev-personal and bootRun to development,
  # the Dockerfile and the production compose file to production, the test
  # suite to development. Anything else has to choose.
  environment: ${ALMIRA_ENV:}
  encryption:
    provider: ${ALMIRA_KMS_PROVIDER:local}
    # Base64, 32 bytes: openssl rand -base64 32
    master-key: ${ALMIRA_KMS_MASTER_KEY:}
    kms-key-id: ${ALMIRA_KMS_KEY_ID:}
    # Development only: generated on first run, never committed. Delete to rotate.
    dev-key-file: ${ALMIRA_DEV_KEY_FILE:./var/dev-kek}
  storage:
    provider: ${ALMIRA_STORAGE_PROVIDER:filesystem}
    root: ${ALMIRA_STORAGE_ROOT:./var/documents}
    max-file-bytes: 20971520
  notifications:
    provider: ${ALMIRA_NOTIFY_PROVIDER:log}
  db:
    url: ${ALMIRA_DB_URL:jdbc:postgresql://localhost:55432/almira}
    owner-user: ${ALMIRA_DB_OWNER_USER:almira}
    owner-password: ${ALMIRA_DB_OWNER_PASSWORD:dev}
    app-user: ${ALMIRA_DB_APP_USER:almira_app}
    app-password: ${ALMIRA_DB_APP_PASSWORD:app_dev_password}
  jwt:
    secret: ${ALMIRA_JWT_SECRET:development-only-secret-please-override-in-every-real-environment}
    issuer: almira
    access-ttl: ${ALMIRA_JWT_ACCESS_TTL:15m}
    refresh-ttl: ${ALMIRA_JWT_REFRESH_TTL:30d}
  # Every outside service, and which of three states it is in: off, sandbox or
  # live. All default to sandbox, so a fresh checkout talks to nothing real.
  #
  # These were previously read only by @ConditionalOnProperty and declared
  # nowhere, which made them impossible to find and impossible to audit.
  # Setting one to `live` refuses to start until a live adapter for it exists —
  # see docs/13 for which of these can have one today.
  providers:
    sms:
      mode: ${ALMIRA_PROVIDER_SMS_MODE:sandbox}
      base-url: ${ALMIRA_PROVIDER_SMS_BASE_URL:}
      api-key: ${ALMIRA_PROVIDER_SMS_API_KEY:}
      sender-id: ${ALMIRA_PROVIDER_SMS_SENDER_ID:}
      template-id: ${ALMIRA_PROVIDER_SMS_TEMPLATE_ID:}
      timeout: ${ALMIRA_PROVIDER_SMS_TIMEOUT:10s}
      max-attempts: ${ALMIRA_PROVIDER_SMS_MAX_ATTEMPTS:3}
    email:
      mode: ${ALMIRA_PROVIDER_EMAIL_MODE:sandbox}
      base-url: ${ALMIRA_PROVIDER_EMAIL_BASE_URL:}
      api-key: ${ALMIRA_PROVIDER_EMAIL_API_KEY:}
      timeout: ${ALMIRA_PROVIDER_EMAIL_TIMEOUT:10s}
    push:
      mode: ${ALMIRA_PROVIDER_PUSH_MODE:sandbox}
      base-url: ${ALMIRA_PROVIDER_PUSH_BASE_URL:}
      api-key: ${ALMIRA_PROVIDER_PUSH_API_KEY:}
      timeout: ${ALMIRA_PROVIDER_PUSH_TIMEOUT:10s}
    digilocker:
      mode: ${ALMIRA_PROVIDER_DIGILOCKER_MODE:sandbox}
      base-url: ${ALMIRA_PROVIDER_DIGILOCKER_BASE_URL:}
      client-id: ${ALMIRA_PROVIDER_DIGILOCKER_CLIENT_ID:}
      client-secret: ${ALMIRA_PROVIDER_DIGILOCKER_CLIENT_SECRET:}
      timeout: ${ALMIRA_PROVIDER_DIGILOCKER_TIMEOUT:15s}
    aa:
      mode: ${ALMIRA_PROVIDER_AA_MODE:sandbox}
      base-url: ${ALMIRA_PROVIDER_AA_BASE_URL:}
      client-id: ${ALMIRA_PROVIDER_AA_CLIENT_ID:}
      client-secret: ${ALMIRA_PROVIDER_AA_CLIENT_SECRET:}
      timeout: ${ALMIRA_PROVIDER_AA_TIMEOUT:20s}
    whatsapp:
      mode: ${ALMIRA_PROVIDER_WHATSAPP_MODE:sandbox}
      base-url: ${ALMIRA_PROVIDER_WHATSAPP_BASE_URL:}
      api-key: ${ALMIRA_PROVIDER_WHATSAPP_API_KEY:}
      webhook-secret: ${ALMIRA_PROVIDER_WHATSAPP_WEBHOOK_SECRET:}
      timeout: ${ALMIRA_PROVIDER_WHATSAPP_TIMEOUT:10s}

  otp:
    provider: ${ALMIRA_OTP_PROVIDER:log}
    ttl: 5m
    max-attempts: 5
    resend-cooldown: 30s
    max-per-hour: 5
    # Per network, per hour. The default protects a real deployment, where one
    # address making dozens of sign-in attempts is an attack. On a laptop every
    # request comes from 127.0.0.1, so running the three end-to-end suites back
    # to back — which is exactly what the runbook and the audit checklist ask
    # for — used to exhaust it and fail with "too many attempts from this
    # network", which reads like a broken build rather than a working defence.
    max-per-ip-per-hour: ${ALMIRA_OTP_MAX_PER_IP_PER_HOUR:20}

springdoc:
  # The spec IS the contract, so it contains exactly what the app depends on.
  # /health is operational — useful, but not something a client builds against,
  # and including it would mean the contract test guards an endpoint that is
  # free to change.
  paths-to-match: /api/v1/**
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs
    # Endpoints grouped by tag, alphabetical, so the browsable docs and the
    # frozen spec read in the same order.
    operations-sorter: alpha
    tags-sorter: alpha
  # Deterministic output: the contract test diffs this against a committed file,
  # and map ordering that varies per JVM run would make every diff noise.
  writer-with-order-by-keys: true

logging:
  level:
    root: INFO
    tech.bhrigu.almira: DEBUG
    org.flywaydb: INFO
