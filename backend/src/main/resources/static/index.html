<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#14685C" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14130F" media="(prefers-color-scheme: dark)">
  <title>Almira</title>
  <meta name="description" content="Everything your family owns and owes, in one calm, private place.">

  <!-- Fraunces for numbers and titles, Inter for the interface, Noto for
       Telugu and Devanagari (docs/25 §3). Served from here, never from a font
       CDN: a privacy-first app should not tell anyone else who opened it
       (P-36). tokens.css declares them, with a system fallback behind each.
       Inter's Latin file is the one every screen needs, so it starts early. -->
  <link rel="preload" href="/app/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Installable: the manifest, the icons iOS and Android each want, and the
       two meta tags that make Safari open it as an app rather than a tab.
       docs/17 says what the offline story is, and deliberately is not. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Almira">
  <meta name="application-name" content="Almira">

  <link rel="stylesheet" href="/app/tokens.css">
  <link rel="stylesheet" href="/app/base.css">
  <!-- The mark itself, as vector: a tab is the smallest place it appears and
       the one place a resized bitmap shows. Rendered from brand/almira-mark.svg
       by brand/render-icons.py, like every other icon here. -->
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/icons/icon-192.png" sizes="192x192">
</head>
<body>
  <div id="root">
    <!-- First paint before the module loads. Matches the auth card's shape so
         the swap is a settle, not a jump. -->
    <div class="auth">
      <div class="auth-card card">
        <div class="stack-3">
          <div class="skeleton" style="height:34px;width:65%"></div>
          <div class="skeleton" style="height:20px;width:90%"></div>
          <div class="skeleton" style="height:44px"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Applied before the module loads so a dark-mode or larger-text reader
    // never sees a flash of the default. prefs.js owns these keys and does the
    // same again once it loads; this copy only has to be right, not complete.
    try {
      const root = document.documentElement;
      const theme = localStorage.getItem("almira.theme");
      if (["light", "dark", "clear"].includes(theme)) root.setAttribute("data-theme", theme);
      const text = localStorage.getItem("almira.text");
      if (["larger", "largest"].includes(text)) root.setAttribute("data-text", text);
      const data = localStorage.getItem("almira.data");
      const saver = navigator.connection && navigator.connection.saveData;
      if (data === "on" || (data !== "off" && saver)) root.setAttribute("data-save-data", "on");
    } catch (_) {}
  </script>
  <script type="module" src="/app/app.js"></script>
  <script>
    // Registered after load so it never competes with the first paint, and
    // guarded because a browser without service workers must still work — this
    // is an enhancement, not a dependency.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {
          // A failed registration is not worth interrupting anybody over: the
          // app works online exactly as before.
        });
      });
    }
  </script>
</body>
</html>
