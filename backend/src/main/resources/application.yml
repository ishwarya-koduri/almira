spring:
  application:
    name: almira
  # The DataSource beans are declared explicitly in DatabaseConfig (two roles:
  # owner for migrations, non-owner for requests), so auto-configuration is off.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  data:
    redis:
      host: ${ALMIRA_REDIS_HOST:localhost}
      port: ${ALMIRA_REDIS_PORT:56379}
      # Empty locally, where Redis is not reachable off the machine. Set in any
      # deployment: this store holds one-time codes, and a code store anybody
      # can read is a sign-in anybody can complete.
      password: ${ALMIRA_REDIS_PASSWORD:}
      timeout: 2s
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # Documents are scans and photos; the 1MB default rejects most of them.
      max-file-size: 20MB
      max-request-size: 24MB

server:
  port: ${ALMIRA_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful
  # Who the client is, for rate limiting and audit. `native` hands
  # X-Forwarded-For to Tomcat's RemoteIpValve, which believes it ONLY when the
  # TCP peer is a trusted proxy — by default loopback and the private ranges
  # (10/8, 172.16/12, 192.168/16, 169.254/16), which covers a reverse proxy on
  # the same host reaching the container through Docker. It then walks the
  # header from the right and takes the first address that is not a trusted
  # proxy, so a client-written value on the left is ignored. The proxy must
  # APPEND to the header (nginx `$proxy_add_x_forwarded_for`, Caddy's default),
  # not pass the client's through untouched. A proxy outside those ranges needs
  # server.tomcat.remoteip.internal-proxies set to match it.
  forward-headers-strategy: native

almira:
  # Anything other than "development" makes every startup check strict: a real
  # key-encryption key becomes mandatory, the published JWT secret is refused,
  # and a database without page checksums is refused.
  #
  # There is deliberately NO default. It used to be `${ALMIRA_ENV:development}`,
  # which meant a jar started without the variable decided it was a development
  # machine — and so accepted the development JWT secret published in this
  # repository. Reproduced before this changed: with ALMIRA_ENV unset, a token
  # signed with that secret, for a session the server never issued, returned
  # 200 from /api/v1/me as a real user. A missing value now counts as "not
  # development", so every check applies.
  #
  # Every intended launcher sets it: dev-personal and bootRun to development,
  # the Dockerfile and the production compose file to production, the test
  # suite to development. Anything else has to choose.
  environment: ${ALMIRA_ENV:}
  # text (default) for a terminal, json for a log collector: one object per
  # line, no MDC and no exception messages, emails and long digit runs scrubbed
  # (ops/JsonLogFormatter). The production compose file sets json.
  log:
    format: ${ALMIRA_LOG_FORMAT:text}
  # Aggregate product events per day, about nobody (docs/what-we-measure.md).
  # On by default, with an opt-out per person in Settings; false counts nothing.
  measurement:
    enabled: ${ALMIRA_MEASUREMENT_ENABLED:true}
  encryption:
    provider: ${ALMIRA_KMS_PROVIDER:local}
    # Base64, 32 bytes: openssl rand -base64 32
    master-key: ${ALMIRA_KMS_MASTER_KEY:}
    kms-key-id: ${ALMIRA_KMS_KEY_ID:}
    # Development only: generated on first run, never committed. Delete to rotate.
    dev-key-file: ${ALMIRA_DEV_KEY_FILE:./var/dev-kek}
  storage:
    provider: ${ALMIRA_STORAGE_PROVIDER:filesystem}
    root: ${ALMIRA_STORAGE_ROOT:./var/documents}
    max-file-bytes: 20971520
    # Only read when provider is s3. Documents are encrypted before they reach
    # either provider, so the bucket holds ciphertext. See docs/17 §6.
    s3:
      bucket: ${ALMIRA_S3_BUCKET:}
      region: ${ALMIRA_S3_REGION:}
      endpoint: ${ALMIRA_S3_ENDPOINT:}
      access-key-id: ${ALMIRA_S3_ACCESS_KEY_ID:}
      secret-access-key: ${ALMIRA_S3_SECRET_ACCESS_KEY:}
      path-style: ${ALMIRA_S3_PATH_STYLE:false}
      prefix: ${ALMIRA_S3_PREFIX:documents/}
  notifications:
    provider: ${ALMIRA_NOTIFY_PROVIDER:log}
  # Notifications are queued by the request or sweep that causes them and sent
  # by a background worker (docs/13 "Interactive and background"). It is woken
  # after each commit that queues something, and polls at this interval for
  # anything missed. ISO-8601, because @Scheduled reads it.
  outbox:
    poll-interval: ${ALMIRA_OUTBOX_POLL_INTERVAL:PT2S}
    batch-size: 50
  # "Contact us" in Settings (X-42). Off unless set: a channel ("whatsapp" or
  # "email"), its address (+91... or name@domain), and one stated reply time. No
  # provider is called; the client opens a wa.me or mailto: link itself. A
  # malformed channel or address refuses to start rather than showing a dead link.
  support:
    channel: ${ALMIRA_SUPPORT_CHANNEL:}
    address: ${ALMIRA_SUPPORT_ADDRESS:}
    reply-time: ${ALMIRA_SUPPORT_REPLY_TIME:}
  # Who answers a complaint about personal data, and within how many days
  # (DPDP Act s.13, Rules 9 and 14(3); docs/23 "Your data rights"). Shown in
  # every rights reply. Unset name or email is reported as "not named yet",
  # never filled in with something invented. The period must be 1 to 90 days or
  # the server refuses to start.
  privacy:
    grievance:
      name: ${ALMIRA_GRIEVANCE_NAME:}
      email: ${ALMIRA_GRIEVANCE_EMAIL:}
      response-days: ${ALMIRA_GRIEVANCE_RESPONSE_DAYS:30}
  db:
    url: ${ALMIRA_DB_URL:jdbc:postgresql://localhost:55432/almira}
    owner-user: ${ALMIRA_DB_OWNER_USER:almira}
    owner-password: ${ALMIRA_DB_OWNER_PASSWORD:dev}
    app-user: ${ALMIRA_DB_APP_USER:almira_app}
    app-password: ${ALMIRA_DB_APP_PASSWORD:app_dev_password}
  jwt:
    secret: ${ALMIRA_JWT_SECRET:development-only-secret-please-override-in-every-real-environment}
    issuer: almira
    access-ttl: ${ALMIRA_JWT_ACCESS_TTL:15m}
    refresh-ttl: ${ALMIRA_JWT_REFRESH_TTL:30d}
  # Every outside service, and which of three states it is in: disabled, sandbox
  # or live. All default to sandbox, so a fresh checkout talks to nothing real —
  # except aa, which defaults to disabled: Account Aggregator is cut from v1,
  # because production access needs an FIU regulated by RBI, SEBI, IRDAI or
  # PFRDA (docs/providers/account-aggregator.md). Set it to sandbox to try it.
  #
  # disabled is a normal state: startup succeeds, the status endpoint reports
  # DISABLED, and every call to that provider answers 409 provider_disabled. A
  # disabled notification channel is skipped and records nothing — but email
  # disabled while auth.sign-in-channels includes email refuses to start, naming
  # both, because email codes are sent through the email provider. The old word
  # `off` refuses to start and names `disabled`.
  #
  # These were previously read only by @ConditionalOnProperty and declared
  # nowhere, which made them impossible to find and impossible to audit.
  # Setting one to `live` refuses to start until a live adapter for it exists —
  # see docs/13 for which of these can have one today.
  providers:
    sms:
      mode: ${ALMIRA_PROVIDER_SMS_MODE:sandbox}
      base-url: ${ALMIRA_PROVIDER_SMS_BASE_URL:}
      api-key: ${ALMIRA_PROVIDER_SMS_API_KEY:}
      sender-id: ${ALMIRA_PROVIDER_SMS_SENDER_ID:}
      template-id: ${ALMIRA_PROVIDER_SMS_TEMPLATE_ID:}
      timeout: ${ALMIRA_PROVIDER_SMS_TIMEOUT:10s}
      max-attempts: ${ALMIRA_PROVIDER_SMS_MAX_ATTEMPTS:3}
      retry-backoff: ${ALMIRA_PROVIDER_SMS_RETRY_BACKOFF:500ms}
    email:
      mode: ${ALMIRA_PROVIDER_EMAIL_MODE:sandbox}
      base-url: ${ALMIRA_PROVIDER_EMAIL_BASE_URL:}
      api-key: ${ALMIRA_PROVIDER_EMAIL_API_KEY:}
      timeout: ${ALMIRA_PROVIDER_EMAIL_TIMEOUT:10s}
      max-attempts: ${ALMIRA_PROVIDER_EMAIL_MAX_ATTEMPTS:3}
      retry-backoff: ${ALMIRA_PROVIDER_EMAIL_RETRY_BACKOFF:500ms}
      # Read only when mode is live (provider/SmtpEmailSender.kt, docs/13 §5).
      smtp:
        host: ${ALMIRA_PROVIDER_EMAIL_SMTP_HOST:}
        port: ${ALMIRA_PROVIDER_EMAIL_SMTP_PORT:587}
        username: ${ALMIRA_PROVIDER_EMAIL_SMTP_USERNAME:}
        password: ${ALMIRA_PROVIDER_EMAIL_SMTP_PASSWORD:}
        from: ${ALMIRA_PROVIDER_EMAIL_SMTP_FROM:}
        start-tls: ${ALMIRA_PROVIDER_EMAIL_SMTP_START_TLS:true}
    push:
      mode: ${ALMIRA_PROVIDER_PUSH_MODE:sandbox}
      base-url: ${ALMIRA_PROVIDER_PUSH_BASE_URL:}
      api-key: ${ALMIRA_PROVIDER_PUSH_API_KEY:}
      timeout: ${ALMIRA_PROVIDER_PUSH_TIMEOUT:10s}
      max-attempts: ${ALMIRA_PROVIDER_PUSH_MAX_ATTEMPTS:3}
      retry-backoff: ${ALMIRA_PROVIDER_PUSH_RETRY_BACKOFF:500ms}
    digilocker:
      mode: ${ALMIRA_PROVIDER_DIGILOCKER_MODE:sandbox}
      base-url: ${ALMIRA_PROVIDER_DIGILOCKER_BASE_URL:}
      client-id: ${ALMIRA_PROVIDER_DIGILOCKER_CLIENT_ID:}
      client-secret: ${ALMIRA_PROVIDER_DIGILOCKER_CLIENT_SECRET:}
      timeout: ${ALMIRA_PROVIDER_DIGILOCKER_TIMEOUT:15s}
      max-attempts: ${ALMIRA_PROVIDER_DIGILOCKER_MAX_ATTEMPTS:3}
      retry-backoff: ${ALMIRA_PROVIDER_DIGILOCKER_RETRY_BACKOFF:500ms}
    aa:
      mode: ${ALMIRA_PROVIDER_AA_MODE:disabled}
      base-url: ${ALMIRA_PROVIDER_AA_BASE_URL:}
      client-id: ${ALMIRA_PROVIDER_AA_CLIENT_ID:}
      client-secret: ${ALMIRA_PROVIDER_AA_CLIENT_SECRET:}
      timeout: ${ALMIRA_PROVIDER_AA_TIMEOUT:20s}
      max-attempts: ${ALMIRA_PROVIDER_AA_MAX_ATTEMPTS:3}
      retry-backoff: ${ALMIRA_PROVIDER_AA_RETRY_BACKOFF:500ms}
    whatsapp:
      mode: ${ALMIRA_PROVIDER_WHATSAPP_MODE:sandbox}
      base-url: ${ALMIRA_PROVIDER_WHATSAPP_BASE_URL:}
      api-key: ${ALMIRA_PROVIDER_WHATSAPP_API_KEY:}
      webhook-secret: ${ALMIRA_PROVIDER_WHATSAPP_WEBHOOK_SECRET:}
      timeout: ${ALMIRA_PROVIDER_WHATSAPP_TIMEOUT:10s}
      max-attempts: ${ALMIRA_PROVIDER_WHATSAPP_MAX_ATTEMPTS:3}
      retry-backoff: ${ALMIRA_PROVIDER_WHATSAPP_RETRY_BACKOFF:500ms}
    # The most a person waits on one DigiLocker or Account Aggregator call, retries
    # included. Provider calls run outside any database transaction (known-issues 21).
    connect-budget: ${ALMIRA_PROVIDER_CONNECT_BUDGET:20s}

  # Public market data (docs/13 §6). Both feeds are OFF unless switched on:
  # with the defaults nothing here reaches the network. Nothing about a
  # household is ever sent — each is a plain GET for a public file.
  #   fx      the ECB's daily euro reference rates, recorded as shared rupee
  #           rates marked "ecb" and dated with the ECB's date
  #   prices  AMFI's daily NAV file and the NSE/BSE end-of-day bhavcopies,
  #           recorded as valuations marked with their source and date
  market-data:
    fx:
      enabled: ${ALMIRA_MARKET_FX_ENABLED:false}
      cron: ${ALMIRA_MARKET_FX_CRON:0 15 21 * * *}
    prices:
      enabled: ${ALMIRA_MARKET_PRICES_ENABLED:false}
      cron: ${ALMIRA_MARKET_PRICES_CRON:0 30 23 * * *}
      sources: ${ALMIRA_MARKET_PRICES_SOURCES:amfi,nse,bse}

  # How people sign in: phone, email, or phone,email. phone by default, so a
  # fresh checkout, the suites and the e2e scripts are unchanged. The closed
  # alpha runs email alone, with an allowlist — two channels on at once let one
  # person make two accounts. Email needs the allowlist: an empty one with email
  # enabled refuses to start. Addresses off the list get the same answer as
  # addresses on it and no email (docs/13 §5, docs/api/README.md).
  auth:
    sign-in-channels: ${ALMIRA_SIGN_IN_CHANNELS:phone}
    email-allowlist: ${ALMIRA_ALPHA_EMAIL_ALLOWLIST:}

  # Passkeys. Off until both are set, because a passkey is bound to its domain
  # for good: set the domain people will use (ALMIRA_WEBAUTHN_RP_ID=almira.example.in)
  # and the exact origin (ALMIRA_WEBAUTHN_ORIGINS=https://almira.example.in).
  # Development: localhost and http://localhost:8080. The authenticator app and
  # recovery codes do not depend on this.
  webauthn:
    rp-id: ${ALMIRA_WEBAUTHN_RP_ID:}
    rp-name: ${ALMIRA_WEBAUTHN_RP_NAME:Almira}
    origins: ${ALMIRA_WEBAUTHN_ORIGINS:}

  otp:
    provider: ${ALMIRA_OTP_PROVIDER:log}
    ttl: 5m
    max-attempts: 5
    resend-cooldown: 30s
    max-per-hour: 5
    # One attempt per code request, under this timeout, never retried: a person
    # is waiting and can press resend. Not the SMS provider's timeout, which is
    # for background delivery. 0 < value <= 15s. See AlmiraProperties.Otp.
    send-timeout: ${ALMIRA_OTP_SEND_TIMEOUT:5s}
    # Per network, per hour. The default protects a real deployment, where one
    # address making dozens of sign-in attempts is an attack. On a laptop every
    # request comes from 127.0.0.1, so running the three end-to-end suites back
    # to back — which is exactly what the runbook and the audit checklist ask
    # for — used to exhaust it and fail with "too many attempts from this
    # network", which reads like a broken build rather than a working defence.
    max-per-ip-per-hour: ${ALMIRA_OTP_MAX_PER_IP_PER_HOUR:20}
    # Wrong codes per network per hour, across all numbers. Successes do not
    # count. See AlmiraProperties.Otp.
    max-verify-failures-per-ip-per-hour: ${ALMIRA_OTP_MAX_VERIFY_FAILURES_PER_IP_PER_HOUR:30}

springdoc:
  # The spec IS the contract, so it contains exactly what the app depends on.
  # /health is operational — useful, but not something a client builds against,
  # and including it would mean the contract test guards an endpoint that is
  # free to change.
  paths-to-match: /api/v1/**
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs
    # Endpoints grouped by tag, alphabetical, so the browsable docs and the
    # frozen spec read in the same order.
    operations-sorter: alpha
    tags-sorter: alpha
  # Deterministic output: the contract test diffs this against a committed file,
  # and map ordering that varies per JVM run would make every diff noise.
  writer-with-order-by-keys: true

logging:
  level:
    root: INFO
    tech.bhrigu.almira: DEBUG
    org.flywaydb: INFO
