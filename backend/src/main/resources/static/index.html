<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FBF9F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14130F" media="(prefers-color-scheme: dark)">
  <title>Almira</title>
  <meta name="description" content="Everything your family owns and owes, in one calm, private place.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fraunces for numbers and headlines, Inter for the interface (docs/02 §3).
       Both have real fallbacks in tokens.css, so the app is legible before the
       fonts arrive and stays legible if they never do. -->
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="/app/tokens.css">
  <link rel="stylesheet" href="/app/base.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230F5A57'/><text x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23fff' text-anchor='middle'>A</text></svg>">
</head>
<body>
  <div id="root">
    <!-- First paint before the module loads. Matches the auth card's shape so
         the swap is a settle, not a jump. -->
    <div class="auth">
      <div class="auth-card card">
        <div class="stack-3">
          <div class="skeleton" style="height:34px;width:65%"></div>
          <div class="skeleton" style="height:20px;width:90%"></div>
          <div class="skeleton" style="height:44px"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Applied before the module loads so a dark-mode user never sees a flash of
    // the light canvas.
    try {
      const theme = localStorage.getItem("almira.theme");
      if (theme && theme !== "system") document.documentElement.setAttribute("data-theme", theme);
    } catch (_) {}
  </script>
  <script type="module" src="/app/app.js"></script>
</body>
</html>
