# Nothing here points outside this folder. GRADLE_USER_HOME, ANDROID_HOME and
# KONAN_DATA_DIR come from ~/Developer/almira-personal/env.sh, so the caches,
# the SDK and the Kotlin/Native toolchain all live beside this checkout rather
# than in the home directory.

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
# The iOS targets are declared so the project structure is real and committed.
# Nothing compiles for iOS until an iOS task is invoked, which needs Xcode.
kotlin.native.ignoreDisabledTargets=true
